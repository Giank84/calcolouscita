<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcolo Orario di Uscita</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --navy-deep: #061c33;
        --navy: #0c2c4d;
        --navy-light: #163d68;
        --gold: #c9a45c;
        --gold-light: #e6cb8f;
        --foam: #eaf4fb;
        --text: #eaf4fb;
        --text-soft: #a9c2d8;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 40px 20px;
        font-family: "Montserrat", sans-serif;
        background: linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-light) 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        position: relative;
    }

    .wave-bg {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 220px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.5;
    }

    .wave-bg svg { width: 100%; height: 100%; display: block; }

    .stars {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
            radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.5), transparent),
            radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.4), transparent),
            radial-gradient(1.5px 1.5px at 85% 10%, rgba(255,255,255,0.5), transparent),
            radial-gradient(1px 1px at 40% 8%, rgba(255,255,255,0.35), transparent),
            radial-gradient(1px 1px at 55% 35%, rgba(255,255,255,0.3), transparent);
        background-size: 100% 100%;
    }

    .card {
        position: relative;
        z-index: 1;
        background: linear-gradient(165deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
        backdrop-filter: blur(18px);
        border: 1px solid rgba(201,164,92,0.35);
        width: 100%;
        max-width: 460px;
        padding: 42px 38px 44px;
        border-radius: 22px;
        box-shadow:
            0 30px 70px -20px rgba(0,0,0,0.6),
            0 0 0 1px rgba(255,255,255,0.04) inset;
        animation: rise 0.7s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .crest {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
    }

    .crest .material-symbols-rounded {
        font-size: 34px;
        color: var(--gold);
    }

    .eyebrow {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold-light);
        font-weight: 600;
        text-align: center;
        margin-bottom: 8px;
    }

    h2 {
        font-family: "Playfair Display", serif;
        text-align: center;
        margin: 0 0 6px;
        color: var(--foam);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.01em;
    }

    .subtitle {
        display: block;
        text-align: center;
        font-size: 12.5px;
        font-weight: 400;
        color: var(--text-soft);
        margin-bottom: 30px;
        letter-spacing: 0.03em;
    }

    .gold-rule {
        width: 60px;
        height: 1.5px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        margin: 0 auto 30px;
    }

    .field {
        margin-top: 22px;
        position: relative;
    }

    .field-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
    }

    .field-head .material-symbols-rounded {
        font-size: 18px;
        color: var(--gold);
    }

    .field-head label {
        font-weight: 600;
        font-size: 12.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-soft);
    }

    .time-picker {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(201,164,92,0.25);
        border-radius: 12px;
        padding: 13px 18px;
        font-size: 21px;
        transition: border-color 0.25s, background 0.25s;
    }

    .time-picker:hover,
    .time-picker:focus-within {
        border-color: var(--gold);
        background: rgba(201,164,92,0.07);
    }

    .time-picker select {
        background: transparent;
        border: none;
        font-size: 21px;
        color: var(--foam);
        outline: none;
        appearance: none;
        padding: 4px 8px;
        cursor: pointer;
        font-weight: 500;
        font-family: "Montserrat", sans-serif;
        text-align: center;
        border-radius: 4px;
    }

    .time-picker select option {
        background: var(--navy);
        color: var(--foam);
    }

    .time-picker select:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
    }

    .time-picker span.sep {
        margin: 0 6px;
        font-weight: 700;
        color: var(--gold);
        font-size: 20px;
    }

    /* --- Toggle switch for the optional "desired exit time" field --- */
    .field-head.optional {
        justify-content: space-between;
        cursor: pointer;
        user-select: none;
    }

    .field-head.optional .label-group {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 21px;
        flex-shrink: 0;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .switch .track {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(201,164,92,0.35);
        border-radius: 20px;
        transition: background 0.25s, border-color 0.25s;
    }

    .switch .track::before {
        content: "";
        position: absolute;
        height: 15px;
        width: 15px;
        left: 2px;
        top: 2px;
        background: var(--text-soft);
        border-radius: 50%;
        transition: transform 0.25s, background 0.25s;
    }

    .switch input:checked + .track {
        background: rgba(201,164,92,0.35);
        border-color: var(--gold);
    }

    .switch input:checked + .track::before {
        transform: translateX(17px);
        background: var(--gold-light);
    }

    #pausaDesiderata {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
        margin-top: 0;
    }

    #pausaDesiderata.open {
        max-height: 120px;
        opacity: 1;
        margin-top: 10px;
    }

    .calc-btn {
        width: 100%;
        margin-top: 36px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        position: relative;
    }

    .calc-btn .face {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 17px;
        font-family: "Montserrat", sans-serif;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: none;
        border-radius: 12px;
        color: var(--navy-deep);
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
        box-shadow: 0 10px 25px -8px rgba(201,164,92,0.55);
    }

    .calc-btn:hover .face {
        filter: brightness(1.08);
        box-shadow: 0 14px 30px -8px rgba(201,164,92,0.7);
    }

    .calc-btn:active .face {
        transform: scale(0.96);
    }

    .calc-btn:focus-visible .face {
        outline: 2px solid var(--foam);
        outline-offset: 3px;
    }

    .calc-btn .material-symbols-rounded {
        font-size: 19px;
    }

    .placeholder {
        text-align: center;
        font-size: 12.5px;
        color: var(--text-soft);
        letter-spacing: 0.03em;
        margin-top: 24px;
    }

    #result {
        margin-top: 0;
        padding: 0;
        text-align: center;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height 0.5s ease, opacity 0.45s ease, margin-top 0.4s ease;
    }

    #result.show {
        max-height: 480px;
        opacity: 1;
        margin-top: 26px;
    }

    .result-inner {
        border: 1px solid rgba(201,164,92,0.4);
        border-radius: 16px;
        padding: 24px 18px;
        position: relative;
        background: linear-gradient(165deg, rgba(201,164,92,0.1), rgba(255,255,255,0.02));
    }

    .result-inner::before {
        content: "";
        position: absolute;
        top: -1px; left: -1px; right: -1px;
        height: 3px;
        border-radius: 16px 16px 0 0;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .result-inner::after {
        content: "ITINERARIO CONFERMATO";
        position: absolute;
        top: -10px;
        right: 16px;
        background: var(--navy);
        padding: 0 8px;
        font-size: 9px;
        letter-spacing: 0.16em;
        color: var(--gold-light);
        font-weight: 700;
    }

    .result-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 10px;
        margin: 7px 0;
    }

    .result-row.hidden { display: none; }

    .result-label {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-soft);
    }

    .result-value {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        font-weight: 700;
        color: var(--foam);
        letter-spacing: 0.01em;
    }

    .result-value.permesso {
        font-size: 21px;
        color: var(--gold-light);
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
    }

    .result-value.small {
        font-size: 21px;
    }

    .divider {
        height: 1px;
        background: rgba(201,164,92,0.25);
        margin: 14px 0;
    }

    .divider.hidden { display: none; }

    .note {
        font-size: 11.5px;
        color: var(--text-soft);
        letter-spacing: 0.02em;
        margin-top: 4px;
    }
</style>
</head>

<body>

<div class="stars"></div>
<div class="wave-bg">
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
        <path d="M0,120 C240,180 480,60 720,110 C960,160 1200,60 1440,120 L1440,220 L0,220 Z" fill="#0c2c4d" opacity="0.6"></path>
        <path d="M0,150 C240,90 480,190 720,140 C960,90 1200,180 1440,140 L1440,220 L0,220 Z" fill="#163d68" opacity="0.5"></path>
    </svg>
</div>

<div class="card">
    <div class="crest">
        <span class="material-symbols-rounded">sailing</span>
    </div>
    <div class="eyebrow">Registro di bordo</div>
    <h2>Calcolo orario di uscita</h2>
    <span class="subtitle">Imposta la rotta della tua giornata lavorativa</span>
    <div class="gold-rule"></div>

    <div class="field" id="ingresso">
        <div class="field-head">
            <span class="material-symbols-rounded">login</span>
            <label>Ingresso</label>
        </div>
        <div class="time-picker">
            <select class="hour" tabindex="1"></select>
            <span class="sep">:</span>
            <select class="minute" tabindex="2"></select>
        </div>
    </div>

    <div class="field" id="pausaStart">
        <div class="field-head">
            <span class="material-symbols-rounded">restaurant</span>
            <label>Inizio pausa pranzo</label>
        </div>
        <div class="time-picker">
            <select class="hour" tabindex="3"></select>
            <span class="sep">:</span>
            <select class="minute" tabindex="4"></select>
        </div>
    </div>

    <div class="field" id="pausaEnd">
        <div class="field-head">
            <span class="material-symbols-rounded">hourglass_bottom</span>
            <label>Fine pausa pranzo</label>
        </div>
        <div class="time-picker">
            <select class="hour" tabindex="5"></select>
            <span class="sep">:</span>
            <select class="minute" tabindex="6"></select>
        </div>
    </div>

    <div class="field">
        <div class="field-head optional" id="toggleDesiderata">
            <div class="label-group">
                <span class="material-symbols-rounded">flag</span>
                <label>Uscita desiderata</label>
            </div>
            <label class="switch">
                <input type="checkbox" id="desideriUscita" tabindex="7">
                <span class="track"></span>
            </label>
        </div>
        <div id="pausaDesiderata">
            <div class="time-picker">
                <select class="hour" tabindex="8"></select>
                <span class="sep">:</span>
                <select class="minute" tabindex="9"></select>
            </div>
        </div>
    </div>

    <button class="calc-btn" tabindex="10" onclick="calcola()">
        <span class="face"><span class="material-symbols-rounded">approval</span>Calcola</span>
    </button>

    <p class="placeholder" id="placeholder">Inserisci gli orari per calcolare l'uscita</p>

    <div id="result">
        <div class="result-inner">
            <div class="result-row" id="rowUscitaCalcolata">
                <span class="result-label">Uscita calcolata</span>
                <span class="result-value" id="uscitaVal">--:--</span>
            </div>

            <div class="divider" id="dividerRegole"></div>
            <div class="result-row" id="rowPermessoRegole">
                <span class="result-label">Permesso da regole</span>
                <span class="result-value permesso" id="permessoVal">0 min</span>
            </div>

            <div class="divider hidden" id="dividerDesiderata"></div>
            <div class="result-row hidden" id="rowUscitaDesiderata">
                <span class="result-label">Uscita desiderata</span>
                <span class="result-value small" id="uscitaDesVal">--:--</span>
            </div>
            <div class="result-row hidden" id="rowPermessoTotale">
                <span class="result-label" id="labelPermessoTotale">Permesso richiesto</span>
                <span class="result-value permesso" id="permessoTotaleVal">0 min</span>
            </div>
            <p class="note hidden" id="noteDesiderata"></p>
        </div>
    </div>
</div>

<script>
function setupTimePickers() {
    document.querySelectorAll(".time-picker").forEach(tp => {
        const hourSel = tp.querySelector(".hour");
        const minSel = tp.querySelector(".minute");

        for (let h = 0; h < 24; h++) {
            const opt = document.createElement("option");
            opt.value = h.toString().padStart(2, "0");
            opt.textContent = opt.value;
            hourSel.appendChild(opt);
        }

        for (let m = 0; m < 60; m++) {
            const opt = document.createElement("option");
            opt.value = m.toString().padStart(2, "0");
            opt.textContent = opt.value;
            minSel.appendChild(opt);
        }
    });
}

function getTime(id) {
    const group = document.getElementById(id);
    const h = group.querySelector(".hour").value;
    const m = group.querySelector(".minute").value;
    return `${h}:${m}`;
}

function toMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
}

function toHHMM(min) {
    min = (min + 1440) % 1440;
    const h = Math.floor(min / 60);
    const m = min % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}

function formatDurata(min) {
    if (min <= 0) return "0 min";
    const h = Math.floor(min / 60);
    const m = min % 60;
    if (h === 0) return m + " min";
    if (m === 0) return h + " h";
    return h + " h " + m + " min";
}

function playStampSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);

        const bufferSize = ctx.sampleRate * 0.05;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.25, ctx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
        noise.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start();
    } catch (e) {
        // Audio not available, fail silently
    }
}

function toggleDesiderata() {
    const checkbox = document.getElementById("desideriUscita");
    const panel = document.getElementById("pausaDesiderata");
    checkbox.checked = !checkbox.checked;
    panel.classList.toggle("open", checkbox.checked);
}

function calcola() {
    playStampSound();

    let ingresso = getTime("ingresso");
    let pausaStart = getTime("pausaStart");
    let pausaEnd = getTime("pausaEnd");

    let result = document.getElementById("result");
    let placeholder = document.getElementById("placeholder");

    let inMin = toMinutes(ingresso);
    let psMin = toMinutes(pausaStart);
    let peMin = toMinutes(pausaEnd);

    let permesso = 0;

    const minIngresso = 8 * 60;
    if (inMin < minIngresso) inMin = minIngresso;

    const maxIngresso = 9 * 60 + 59;
    if (inMin > maxIngresso) {
        permesso += inMin - (9 * 60);
        inMin = 9 * 60;
    }

    const pausaMinStart = 13 * 60;
    const pausaMaxEnd = 14 * 60 + 30;

    if (psMin < pausaMinStart) {
        permesso += pausaMinStart - psMin;
        psMin = pausaMinStart;
    }

    if (peMin > pausaMaxEnd) {
        permesso += peMin - pausaMaxEnd;
        peMin = pausaMaxEnd;
    }

    let pausaDurata = peMin - psMin;

    const pausaMinima = (toMinutes(ingresso) > maxIngresso) ? 60 : 30;

    if (pausaDurata < pausaMinima) pausaDurata = pausaMinima;

    if (pausaDurata > 90) {
        permesso += pausaDurata - 90;
        pausaDurata = 90;
    }

    const uscita = inMin + 8 * 60 + pausaDurata;

    document.getElementById("uscitaVal").textContent = toHHMM(uscita);
    document.getElementById("permessoVal").textContent = formatDurata(permesso);

    // --- Optional: desired exit time ---
    const vuoleUscitaDesiderata = document.getElementById("desideriUscita").checked;

    const rowUscitaCalcolata = document.getElementById("rowUscitaCalcolata");
    const dividerRegole = document.getElementById("dividerRegole");
    const rowPermessoRegole = document.getElementById("rowPermessoRegole");
    const rowUscitaDesiderata = document.getElementById("rowUscitaDesiderata");
    const rowPermessoTotale = document.getElementById("rowPermessoTotale");
    const dividerDesiderata = document.getElementById("dividerDesiderata");
    const noteDesiderata = document.getElementById("noteDesiderata");
    const labelPermessoTotale = document.getElementById("labelPermessoTotale");

    if (vuoleUscitaDesiderata) {
        // Quando l'uscita desiderata è flaggata, nascondi uscita calcolata e permesso da regole
        rowUscitaCalcolata.classList.add("hidden");
        dividerRegole.classList.add("hidden");
        rowPermessoRegole.classList.add("hidden");

        const uscitaDes = getTime("pausaDesiderata");
        const desMin = toMinutes(uscitaDes);

        document.getElementById("uscitaDesVal").textContent = toHHMM(desMin);
        rowUscitaDesiderata.classList.remove("hidden");
        dividerDesiderata.classList.remove("hidden");

        if (desMin < uscita) {
            const totale = permesso + (uscita - desMin);

            labelPermessoTotale.textContent = "Permesso richiesto";
            document.getElementById("permessoTotaleVal").textContent = formatDurata(totale);
            rowPermessoTotale.classList.remove("hidden");

            noteDesiderata.textContent = "L'uscita desiderata è anticipata: richiedi il permesso indicato.";
            noteDesiderata.classList.remove("hidden");
        } else {
            rowPermessoTotale.classList.add("hidden");
            noteDesiderata.textContent = "Nessun permesso necessario: l'uscita desiderata non è anticipata.";
            noteDesiderata.classList.remove("hidden");
        }
    } else {
        rowUscitaCalcolata.classList.remove("hidden");
        dividerRegole.classList.remove("hidden");
        rowPermessoRegole.classList.remove("hidden");

        rowUscitaDesiderata.classList.add("hidden");
        rowPermessoTotale.classList.add("hidden");
        dividerDesiderata.classList.add("hidden");
        noteDesiderata.classList.add("hidden");
    }

    placeholder.style.display = "none";
    result.classList.add("show");
}

setupTimePickers();

document.getElementById("toggleDesiderata").addEventListener("click", function(e) {
    // avoid double-toggling when the click lands directly on the checkbox/track
    if (e.target.closest(".switch")) return;
    toggleDesiderata();
});

document.getElementById("desideriUscita").addEventListener("change", function() {
    document.getElementById("pausaDesiderata").classList.toggle("open", this.checked);
});
</script>

</body>
</html>
