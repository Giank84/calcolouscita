<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Calcolo Orario di Uscita</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />

<style>
    :root {
        --bg: #f4f6fa;
        --card: #ffffff;
        --text: #1e1e1e;
        --accent: #2a5298;
        --accent-dark: #1e3c72;
        --input-bg: #eef1f6;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --accent: #60a5fa;
            --accent-dark: #3b82f6;
            --input-bg: #334155;
        }
    }

    body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Roboto, Arial;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: background 0.4s ease;
    }

    .card {
        background: var(--card);
        width: 420px;
        padding: 32px;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        animation: fadeIn 0.6s ease-out;
        transition: background 0.4s ease, color 0.4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: var(--accent-dark);
        font-weight: 700;
    }

    label {
        font-weight: 600;
        margin-top: 15px;
        display: block;
    }

    .input-group {
        display: flex;
        align-items: center;
        background: var(--input-bg);
        border-radius: 12px;
        padding: 10px 14px;
        margin-top: 6px;
        transition: background 0.4s ease;
    }

    .input-group span {
        font-size: 24px;
        margin-right: 10px;
        color: var(--accent-dark);
    }

    input {
        border: none;
        background: transparent;
        font-size: 17px;
        width: 100%;
        outline: none;
        color: var(--text);
    }

    button {
        width: 100%;
        margin-top: 28px;
        padding: 14px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        background: var(--accent-dark);
        color: white;
        cursor: pointer;
        transition: 0.25s;
    }

    button:hover {
        background: var(--accent);
        transform: scale(1.03);
    }

    #result {
        margin-top: 28px;
        padding: 22px;
        background: var(--input-bg);
        border-radius: 14px;
        text-align: center;
        font-size: 19px;
        font-weight: 600;
        box-shadow: inset 0 0 12px rgba(0,0,0,0.08);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #result.show {
        opacity: 1;
        transform: translateY(0);
    }
</style>
</head>

<body>

<div class="card">
    <h2>Calcolo Orario di Uscita</h2>

    <label>Orario di ingresso</label>
    <div class="input-group">
        <span class="material-symbols-rounded">login</span>
        <input type="time" id="ingresso">
    </div>

    <label>Inizio pausa pranzo</label>
    <div class="input-group">
        <span class="material-symbols-rounded">restaurant</span>
        <input type="time" id="pausaStart">
    </div>

    <label>Fine pausa pranzo</label>
    <div class="input-group">
        <span class="material-symbols-rounded">hourglass_bottom</span>
        <input type="time" id="pausaEnd">
    </div>

    <button onclick="calcola()">Calcola</button>

    <div id="result">Inserisci i dati per iniziare</div>
</div>

<script>
function toMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
}

function toHHMM(min) {
    min = (min + 1440) % 1440;
    const h = Math.floor(min / 60);
    const m = min % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}

function calcola() {
    let ingresso = document.getElementById("ingresso").value;
    let pausaStart = document.getElementById("pausaStart").value;
    let pausaEnd = document.getElementById("pausaEnd").value;
    let result = document.getElementById("result");

    if (!ingresso || !pausaStart || !pausaEnd) {
        result.innerHTML = "Compila tutti i campi.";
        result.classList.add("show");
        return;
    }

    let inMin = toMinutes(ingresso);
    let psMin = toMinutes(pausaStart);
    let peMin = toMinutes(pausaEnd);

    const minIngresso = 8 * 60;
    if (inMin < minIngresso) inMin = minIngresso;

    const pausaMinStart = 13 * 60;
    const pausaMaxEnd = 14 * 60 + 30;

    let permesso = 0;

    if (psMin < pausaMinStart) {
        permesso += pausaMinStart - psMin;
        psMin = pausaMinStart;
    }

    if (peMin > pausaMaxEnd) {
        permesso += peMin - pausaMaxEnd;
        peMin = pausaMaxEnd;
    }

    let pausaDurata = peMin - psMin;

    if (pausaDurata < 30) {
        permesso += 30 - pausaDurata;
        pausaDurata = 30;
    }
    if (pausaDurata > 90) {
        permesso += pausaDurata - 90;
        pausaDurata = 90;
    }

    const uscita = inMin + 8 * 60 + pausaDurata;

    result.innerHTML = `
        🕒 Uscita possibile (24h): <b>${toHHMM(uscita)}</b><br>
        🎫 Permesso: <b>${permesso} minuti</b>
    `;

    result.classList.add("show");
}
</script>

</body>
</html>
