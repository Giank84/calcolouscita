<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbro di Uscita</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
    :root {
        --paper: #f3eee3;
        --paper-card: #fbf8f0;
        --ink: #1c2b3a;
        --ink-soft: #44566b;
        --brass: #b8862f;
        --brass-light: #d9a84a;
        --stamp-red: #a8362b;
        --line: rgba(28,43,58,0.14);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 40px 20px;
        font-family: "DM Mono", monospace;
        background: var(--paper);
        background-image:
            radial-gradient(circle at 15% 20%, rgba(184,134,47,0.07), transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(28,43,58,0.06), transparent 45%);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        position: relative;
        background: var(--paper-card);
        width: 100%;
        max-width: 460px;
        padding: 38px 36px 42px;
        border-radius: 4px;
        box-shadow:
            0 1px 0 rgba(255,255,255,0.6) inset,
            0 25px 60px -15px rgba(28,43,58,0.35),
            0 0 0 1px rgba(28,43,58,0.06);
        animation: rise 0.7s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px dashed var(--line);
        border-radius: 2px;
        pointer-events: none;
    }

    .eyebrow {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--brass);
        font-weight: 500;
        text-align: center;
        margin-bottom: 6px;
    }

    h2 {
        font-family: "Space Grotesk", sans-serif;
        text-align: center;
        margin: 0 0 30px;
        color: var(--ink);
        font-weight: 700;
        font-size: 27px;
        letter-spacing: -0.01em;
    }

    h2 span {
        display: block;
        font-size: 13px;
        font-weight: 400;
        color: var(--ink-soft);
        margin-top: 6px;
        letter-spacing: 0.01em;
        font-family: "DM Mono", monospace;
    }

    .field {
        margin-top: 22px;
        position: relative;
    }

    .field-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 9px;
    }

    .field-head .material-symbols-rounded {
        font-size: 18px;
        color: var(--brass);
    }

    .field-head label {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: var(--ink);
    }

    .time-picker {
        display: flex;
        align-items: center;
        background: transparent;
        border-bottom: 1.5px solid var(--line);
        padding: 10px 2px;
        font-size: 19px;
        transition: border-color 0.2s;
    }

    .time-picker:hover,
    .time-picker:focus-within {
        border-color: var(--brass);
    }

    .time-picker select {
        background: transparent;
        border: none;
        font-size: 19px;
        color: var(--ink);
        outline: none;
        appearance: none;
        padding: 4px 6px;
        cursor: pointer;
        font-weight: 500;
        font-family: "DM Mono", monospace;
        text-align: center;
        border-radius: 2px;
    }

    .time-picker select:focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 2px;
    }

    .stamp-btn:focus-visible .face {
        outline: 2px solid var(--brass);
        outline-offset: 3px;
    }

    .time-picker span.sep {
        margin: 0 4px;
        font-weight: 700;
        color: var(--brass);
        font-size: 19px;
    }

    .stamp-btn {
        width: 100%;
        margin-top: 34px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        position: relative;
    }

    .stamp-btn .face {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 2px solid var(--ink);
        border-radius: 3px;
        color: var(--ink);
        background: transparent;
        transition: transform 0.12s ease, background 0.18s ease, color 0.18s ease;
    }

    .stamp-btn:hover .face {
        background: var(--ink);
        color: var(--paper-card);
    }

    .stamp-btn:active .face {
        transform: scale(0.96);
    }

    .stamp-btn .material-symbols-rounded {
        font-size: 20px;
    }

    #result {
        margin-top: 28px;
        padding: 0;
        text-align: center;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height 0.45s ease, opacity 0.4s ease, margin-top 0.4s ease;
    }

    #result.show {
        max-height: 260px;
        opacity: 1;
    }

    .result-inner {
        border: 2px solid var(--ink);
        border-radius: 3px;
        padding: 20px 16px;
        position: relative;
        transform: rotate(-1.2deg);
    }

    .result-inner::after {
        content: "TIMBRATO";
        position: absolute;
        top: -11px;
        right: 14px;
        background: var(--paper-card);
        padding: 0 8px;
        font-size: 10px;
        letter-spacing: 0.18em;
        color: var(--stamp-red);
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
    }

    .result-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 10px;
        margin: 6px 0;
    }

    .result-label {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-soft);
    }

    .result-value {
        font-family: "Space Grotesk", sans-serif;
        font-size: 30px;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: -0.01em;
    }

    .result-value.permesso {
        font-size: 22px;
        color: var(--stamp-red);
    }

    .divider {
        height: 1px;
        background: var(--line);
        margin: 12px 0;
    }

    .placeholder {
        text-align: center;
        font-size: 12.5px;
        color: var(--ink-soft);
        letter-spacing: 0.03em;
        margin-top: 26px;
    }
</style>
</head>

<body>

<div class="card">
    <div class="eyebrow">Foglio presenze</div>
    <h2>Calcolo orario di uscita<span>Imposta gli orari e timbra</span></h2>

    <div class="field" id="ingresso">
        <div class="field-head">
            <span class="material-symbols-rounded">login</span>
            <label>Ingresso</label>
        </div>
        <div class="time-picker">
            <select class="hour" tabindex="1"></select>
            <span class="sep">:</span>
            <select class="minute" tabindex="2"></select>
        </div>
    </div>

    <div class="field" id="pausaStart">
        <div class="field-head">
            <span class="material-symbols-rounded">restaurant</span>
            <label>Inizio pausa pranzo</label>
        </div>
        <div class="time-picker">
            <select class="hour" tabindex="3"></select>
            <span class="sep">:</span>
            <select class="minute" tabindex="4"></select>
        </div>
    </div>

    <div class="field" id="pausaEnd">
        <div class="field-head">
            <span class="material-symbols-rounded">hourglass_bottom</span>
            <label>Fine pausa pranzo</label>
        </div>
        <div class="time-picker">
            <select class="hour" tabindex="5"></select>
            <span class="sep">:</span>
            <select class="minute" tabindex="6"></select>
        </div>
    </div>

    <button class="stamp-btn" tabindex="7" onclick="calcola()">
        <span class="face"><span class="material-symbols-rounded">approval</span>Calcola</span>
    </button>

    <p class="placeholder" id="placeholder">Inserisci gli orari per calcolare l'uscita</p>

    <div id="result">
        <div class="result-inner">
            <div class="result-row">
                <span class="result-label">Uscita</span>
                <span class="result-value" id="uscitaVal">--:--</span>
            </div>
            <div class="divider"></div>
            <div class="result-row">
                <span class="result-label">Permesso</span>
                <span class="result-value permesso" id="permessoVal">0 min</span>
            </div>
        </div>
    </div>
</div>

<script>
function setupTimePickers() {
    document.querySelectorAll(".time-picker").forEach(tp => {
        const hourSel = tp.querySelector(".hour");
        const minSel = tp.querySelector(".minute");

        for (let h = 0; h < 24; h++) {
            const opt = document.createElement("option");
            opt.value = h.toString().padStart(2, "0");
            opt.textContent = opt.value;
            hourSel.appendChild(opt);
        }

        for (let m = 0; m < 60; m++) {
            const opt = document.createElement("option");
            opt.value = m.toString().padStart(2, "0");
            opt.textContent = opt.value;
            minSel.appendChild(opt);
        }
    });
}

function getTime(id) {
    const group = document.getElementById(id);
    const h = group.querySelector(".hour").value;
    const m = group.querySelector(".minute").value;
    return `${h}:${m}`;
}

function toMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
}

function toHHMM(min) {
    min = (min + 1440) % 1440;
    const h = Math.floor(min / 60);
    const m = min % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}

function playStampSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);

        const bufferSize = ctx.sampleRate * 0.05;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.25, ctx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
        noise.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start();
    } catch (e) {
        // Audio not available, fail silently
    }
}

function calcola() {
    playStampSound();

    let ingresso = getTime("ingresso");
    let pausaStart = getTime("pausaStart");
    let pausaEnd = getTime("pausaEnd");

    let result = document.getElementById("result");
    let placeholder = document.getElementById("placeholder");

    let inMin = toMinutes(ingresso);
    let psMin = toMinutes(pausaStart);
    let peMin = toMinutes(pausaEnd);

    let permesso = 0;

    const minIngresso = 8 * 60;
    if (inMin < minIngresso) inMin = minIngresso;

    const maxIngresso = 9 * 60 + 59;
    if (inMin > maxIngresso) {
        permesso += inMin - (9 * 60);
        inMin = 9 * 60;
    }

    const pausaMinStart = 13 * 60;
    const pausaMaxEnd = 14 * 60 + 30;

    if (psMin < pausaMinStart) {
        permesso += pausaMinStart - psMin;
        psMin = pausaMinStart;
    }

    if (peMin > pausaMaxEnd) {
        permesso += peMin - pausaMaxEnd;
        peMin = pausaMaxEnd;
    }

    let pausaDurata = peMin - psMin;

    const pausaMinima = (toMinutes(ingresso) > maxIngresso) ? 60 : 30;

    if (pausaDurata < pausaMinima) pausaDurata = pausaMinima;

    if (pausaDurata > 90) {
        permesso += pausaDurata - 90;
        pausaDurata = 90;
    }

    const uscita = inMin + 8 * 60 + pausaDurata;

    document.getElementById("uscitaVal").textContent = toHHMM(uscita);
    document.getElementById("permessoVal").textContent = permesso + " min";

    placeholder.style.display = "none";
    result.classList.add("show");
}

setupTimePickers();
</script>

</body>
</html>
